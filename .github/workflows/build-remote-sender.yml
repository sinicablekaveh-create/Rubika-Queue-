name: Build Remote Sender APK
on:
  workflow_dispatch:
  push:
    branches: ["chatgpt/remote-sender-v1"]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          sha256sum "$APK" | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: RemoteSender-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
